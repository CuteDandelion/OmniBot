name: AgentHQ
options:
  bundleIdPrefix: local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug
packages:
  CodexClient:
    path: CodexClient
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
targets:
  AgentHQ:
    type: application
    platform: macOS
    sources:
      - path: AgentHQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.agenthq
        PRODUCT_NAME: AgentHQ
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: AgentHQ/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Agent HQ
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_ENTITLEMENTS: AgentHQ/AgentHQ.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    info:
      path: AgentHQ/Info.plist
      properties:
        CFBundleDisplayName: Agent HQ
        CFBundleName: Agent HQ
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHighResolutionCapable: true
    dependencies:
      - package: CodexClient
        product: CodexClient
    scheme:
      testTargets:
        - AgentHQTests
  AgentHQTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AgentHQTests
    dependencies:
      - target: AgentHQ
      - package: CodexClient
        product: CodexClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.agenthq.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AgentHQ.app/Contents/MacOS/AgentHQ"
schemes:
  AgentHQ:
    build:
      targets:
        AgentHQ: all
        AgentHQTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentHQTests
